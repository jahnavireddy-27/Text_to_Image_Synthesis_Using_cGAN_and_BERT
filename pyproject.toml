[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-image-gan"
version = "0.1.0"
description = "Reconstruction of a BERT-conditioned GAN for 64x64 image synthesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
